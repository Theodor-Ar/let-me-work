[project]
name = "let-me-work"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.29.1",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.1",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "asyncio==4.0.0",
    "attrs==26.1.0",
    "babel==2.18.0",
    "certifi==2026.6.17",
    "fluent-compiler==1.1",
    "fluent-syntax==0.19.0",
    "fluentogram==1.2.1",
    "frozenlist==1.8.0",
    "idna==3.18",
    "magic-filter==1.0.12",
    "multidict==6.7.1",
    "propcache==0.5.2",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pytz==2026.2",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "uuid6==2025.0.1",
    "uuid7==0.1.0",
    "yarl==1.24.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "Q000", "Q"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
plugins = ["pydantic.mypy"]