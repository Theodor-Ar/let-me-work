
name: let-me-work

services:
  tg-bot:
    build: 
      context: .
      dockerfile: docker/small.Dockerfile
    env_file:
      - .env
    container_name: tg-bot
    restart: always
    # volumes:
    #   - .:/app
    #   - /app/.venv
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:${PG_IMAGE_VERSION}
    container_name: lmw_main_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  
