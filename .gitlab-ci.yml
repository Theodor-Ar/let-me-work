workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
  DOCKERFILE_PATH: "docker/small.Dockerfile"
  UV_CACHE_DIR: ".uv-cache"

stages:
  - lint
  - test
  - build
  - deploy

lint_job:ruff:
  image: ghcr.io/astral-sh/ruff
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
  tags:
    - local

lint_job:mypy:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  stage: lint
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
      - .mypy_cache
  before_script:
    - uv sync --frozen
  script:
    - uv run mypy src tests
  tags:
    - local

test_job:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-alpine
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    - uv sync --frozen
  script:
    - uv run pytest -v --junitxml=report.xml --cov=src --cov-report=term
  coverage: '/TOTAL.*\s+(\d+[\d\.]*\%)/'
  artifacts:
    when: always
    reports:
      junit: report.xml
  tags:
    - local

build_job:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f "$DOCKERFILE_PATH" -t "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
  tags:
    - local

deploy_job:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - echo "$PASSWORD" | docker login -u "$USER" --password-stdin "$CI_REGISTRY"
    - echo "IMAGE_NAME=$IMAGE_NAME" >> .env
  script:
    - docker compose pull tg-bot
    - docker compose up -d tg-bot
  tags:
    - local